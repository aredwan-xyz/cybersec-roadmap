name: Link check

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 1 * *"

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --max-concurrency 8
            --timeout 30
            --max-retries 2
            --accept 200,403,429
            --exclude "img.shields.io"
            "./**/*.md"
          fail: true
