# GitHub Pages site configuration.
# Page titles and navigation are set here, not in each file, so the Markdown
# stays clean when read on GitHub.

title: AI Security in 90 Days
description: A builder's roadmap from first lab to published security assessment, plus a full beginner-to-expert cybersecurity roadmap.
url: https://aredwan-xyz.github.io
baseurl: /cybersec-roadmap

remote_theme: just-the-docs/just-the-docs@v0.10.0
plugins:
  - jekyll-remote-theme

color_scheme: dark
search_enabled: true
heading_anchors: true
mermaid:
  version: "10.9.1"

aux_links:
  "View on GitHub":
    - https://github.com/aredwan-xyz/cybersec-roadmap
aux_links_new_tab: true

gh_edit_link: true
gh_edit_link_text: "Edit this page on GitHub"
gh_edit_repository: https://github.com/aredwan-xyz/cybersec-roadmap
gh_edit_branch: main
gh_edit_view_mode: tree

footer_content: 'Written content licensed CC BY 4.0. Attack only systems you own or are authorized to test.'

exclude:
  - notes
  - .github

defaults:
  # Linked from other pages but kept out of the sidebar
  - scope: { path: "LICENSE.md" }
    values: { layout: default, title: "License", nav_exclude: true }
  - scope: { path: "CODE_OF_CONDUCT.md" }
    values: { layout: default, title: "Code of Conduct", nav_exclude: true }

  # Top level
  - scope: { path: "README.md" }
    values: { layout: default, title: "Home", nav_order: 1, permalink: "/" }
  - scope: { path: "ai-security-90-days/README.md" }
    values: { layout: default, title: "90-Day AI Security Plan", nav_order: 2, permalink: "/ai-security-90-days/" }
  - scope: { path: "ROADMAP.md" }
    values: { layout: default, title: "Beginner-to-Expert Roadmap", nav_order: 3 }
