<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="Cyber Roadmap: learn cybersecurity from zero, in plain English">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#111a33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1280" height="400" fill="url(#bg)"/>
  <rect width="1280" height="400" fill="url(#grid)"/>

  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="80" y="104" font-size="18" letter-spacing="4" fill="#5eead4" font-weight="600">FREE · OPEN SOURCE · PLAIN ENGLISH</text>
    <text x="80" y="188" font-size="76" font-weight="800" fill="#f8fafc" letter-spacing="-2">Cyber Roadmap</text>
    <rect x="80" y="214" width="220" height="6" rx="3" fill="url(#accent)"/>
    <text x="80" y="270" font-size="26" fill="#cbd5e1">Learn cybersecurity from zero, one short lesson at a time.</text>
    <text x="80" y="306" font-size="26" fill="#cbd5e1">Then a clear path to expert, and an AI security track.</text>

    <g font-size="17" font-weight="600" fill="#e2e8f0">
      <rect x="80" y="336" width="150" height="38" rx="19" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.16"/>
      <text x="155" y="361" text-anchor="middle">14 lessons</text>
      <rect x="244" y="336" width="210" height="38" rx="19" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.16"/>
      <text x="349" y="361" text-anchor="middle">100-word glossary</text>
      <rect x="468" y="336" width="200" height="38" rx="19" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.16"/>
      <text x="568" y="361" text-anchor="middle">175 checked links</text>
      <rect x="682" y="336" width="190" height="38" rx="19" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.16"/>
      <text x="777" y="361" text-anchor="middle">13-week AI track</text>
    </g>
  </g>

  <g transform="translate(1010 92)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M90 0 L180 34 V112 C180 170 142 208 90 228 C38 208 0 170 0 112 V34 Z" stroke="url(#accent)" stroke-width="5" fill="#ffffff" fill-opacity="0.03"/>
    <path d="M52 116 L80 144 L132 86" stroke="#f8fafc" stroke-width="9"/>
  </g>
</svg>
